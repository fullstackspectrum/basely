<!DOCTYPE html>
<!--
  Source for readme-banner.png and github-social-preview.png. Render with
  docs/brand/src/render.sh; ?layout=banner (1280×320 at 2x) or
  ?layout=social (1280×640 at 1x).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basely brand</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 300 700; src: url(../../../basely/assets/space-grotesk-var.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(../../../basely/assets/jetbrains-mono-var.woff2) format('woff2'); }
  :root {
    --bg: #0a0d12; --bg-elev: #10151d; --line: #222b38;
    --text: #eef1f6; --text-dim: #9aa4b2; --text-faint: #646f7f;
    --blue: #4f8cff; --blue-soft: #8fb4ff; --yellow: #f5c84c; --orange: #ff8a3d; --red: #ff4d5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; overflow: hidden; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
  }
  body.banner { height: 320px; }
  body.social { height: 640px; }

  .spectrum { position: absolute; display: flex; gap: 6px; }
  .spectrum i { width: 28px; height: 8px; border-radius: 1px; }
  .spectrum i:nth-child(1) { background: var(--blue); }
  .spectrum i:nth-child(2) { background: var(--blue-soft); }
  .spectrum i:nth-child(3) { background: var(--yellow); }
  .spectrum i:nth-child(4) { background: var(--orange); }
  .spectrum i:nth-child(5) { background: var(--red); }

  .lockup { position: absolute; display: flex; align-items: center; gap: 28px; }
  .lockup svg { display: block; }
  .wordmark { font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

  .lede { position: absolute; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); display: flex; align-items: center; }
  .cursor { display: inline-block; background: var(--red); margin-left: 6px; }

  .url { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--text-faint); display: flex; align-items: center; gap: 14px; }
  .url::before { content: ''; width: 8px; height: 8px; background: var(--red); }

  /* The comparison stands where GitPulse has its chart: candidate images
   * with their critical and high advisories as bars. The pick takes the
   * brand blue; the red node marks the image in use today. */
  .cmp { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 15px; }
  .cmp .row {
    display: grid;
    grid-template-columns: 22px 1fr 62px 120px;
    align-items: center;
    height: 30px;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    position: relative;
  }
  .cmp .row:last-child { border-bottom: 1px solid var(--line); }
  .cmp .sign { font-weight: 700; color: var(--text-faint); }
  .cmp .size { color: var(--text-faint); text-align: right; padding-right: 14px; }
  .cmp .bar { height: 6px; border-radius: 3px; background: var(--orange); }
  .cmp .now .name { color: var(--text); }
  .cmp .pick .sign, .cmp .pick .name { color: var(--blue); }
  .cmp .pick .bar { background: var(--blue-soft); }
  .node { position: absolute; right: -26px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--red); }
  .node::after { content: ''; position: absolute; inset: -7px; border: 1px dashed var(--red); border-radius: 50%; opacity: 0.6; }

  /* Banner, 1280×320 */
  .banner .spectrum { left: 64px; top: 72px; }
  .banner .lockup { left: 64px; top: 118px; }
  .banner .lockup svg { width: 76px; height: 76px; }
  .banner .wordmark { font-size: 84px; }
  .banner .lede { left: 64px; top: 240px; font-size: 19px; }
  .banner .cursor { width: 10px; height: 20px; }
  .banner .cmp { left: 780px; top: 92px; width: 400px; }

  /* Social preview, 1280×640 */
  .social .spectrum { left: 96px; top: 96px; }
  .social .lockup { left: 96px; top: 158px; }
  .social .lockup svg { width: 96px; height: 96px; }
  .social .wordmark { font-size: 96px; }
  .social .lede { left: 96px; top: 312px; font-size: 22px; }
  .social .cursor { width: 12px; height: 26px; }
  .social .url { left: 96px; top: 536px; }
  .social .cmp { left: 700px; top: 400px; width: 450px; }
</style>
</head>
<body>
  <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="lockup">
    <svg viewBox="9 9 46 46" aria-hidden="true"><rect x="25" y="11" width="28" height="28" rx="6" fill="#0a0d12" stroke="#4f8cff" stroke-width="3.5"/><rect x="18" y="18" width="28" height="28" rx="6" fill="#0a0d12" stroke="#f5c84c" stroke-width="3.5"/><rect x="11" y="25" width="28" height="28" rx="6" fill="#0a0d12" stroke="#eef1f6" stroke-width="3.5"/><path d="M19.5 39.5l5.5-5.5 5.5 5.5M19.5 46h11" fill="none" stroke="#ff4d5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="wordmark">Basely</span>
  </div>

  <p class="lede">A better base image, with the evidence.<span class="cursor"></span></p>

  <p class="url">github.com/fullstackspectrum/basely</p>

  <div class="cmp" aria-hidden="true">
    <div class="row now"><span class="sign">·</span><span class="name">python:3.12</span><span class="size">412MB</span><span class="bar" style="width:100%"></span><span class="node"></span></div>
    <div class="row"><span class="sign">·</span><span class="name">python:3.12-slim</span><span class="size">43MB</span><span class="bar" style="width:12%"></span></div>
    <div class="row"><span class="sign">·</span><span class="name">python:3.12-alpine</span><span class="size">18MB</span><span class="bar" style="width:6%"></span></div>
    <div class="row pick"><span class="sign">→</span><span class="name">dhi.io/python:3.12</span><span class="size">23MB</span><span class="bar" style="width:4%"></span></div>
    <div class="row"><span class="sign">·</span><span class="name">chainguard/python</span><span class="size">28MB</span><span class="bar" style="width:3%"></span></div>
  </div>

  <script>
    var layout = new URLSearchParams(location.search).get('layout') || 'banner';
    document.body.className = layout;
    // The banner has no room for the URL; GitHub already shows it.
    if (layout === 'banner') document.querySelector('.url').remove();
  </script>
</body>
</html>
